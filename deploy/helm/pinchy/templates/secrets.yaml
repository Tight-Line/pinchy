{{- include "pinchy.validateRequired" . -}}
{{- $secretName := include "pinchy.secretName" . -}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName -}}

{{/*
Gateway token: user-provided > existing secret > auto-generate.
*/}}
{{- $gatewayToken := "" -}}
{{- if .Values.auth.gatewayToken -}}
  {{- $gatewayToken = .Values.auth.gatewayToken -}}
{{- else if and $existingSecret (index $existingSecret.data "gateway-token") -}}
  {{- $gatewayToken = index $existingSecret.data "gateway-token" | b64dec -}}
{{- else -}}
  {{- $gatewayToken = randAlphaNum 48 -}}
{{- end -}}

{{/*
Better Auth secret: user-provided > existing secret > auto-generate.
*/}}
{{- $betterAuthSecret := "" -}}
{{- if .Values.auth.betterAuthSecret -}}
  {{- $betterAuthSecret = .Values.auth.betterAuthSecret -}}
{{- else if and $existingSecret (index $existingSecret.data "better-auth-secret") -}}
  {{- $betterAuthSecret = index $existingSecret.data "better-auth-secret" | b64dec -}}
{{- else -}}
  {{- $betterAuthSecret = randAlphaNum 48 -}}
{{- end -}}

{{/*
Encryption key: user-provided > existing secret > auto-generate (32 bytes hex = 64 chars).
*/}}
{{- $encryptionKey := "" -}}
{{- if .Values.auth.encryptionKey -}}
  {{- $encryptionKey = .Values.auth.encryptionKey -}}
{{- else if and $existingSecret (index $existingSecret.data "encryption-key") -}}
  {{- $encryptionKey = index $existingSecret.data "encryption-key" | b64dec -}}
{{- else -}}
  {{- $encryptionKey = randAlphaNum 64 -}}
{{- end -}}

{{/*
PostgreSQL password: user-provided > existing secret > auto-generate.
Skipped when postgresql.auth.existingSecret is set.
*/}}
{{- $pgPassword := "" -}}
{{- if .Values.postgresql.auth.existingSecret -}}
  {{- $pgPassword = "" -}}
{{- else if .Values.postgresql.auth.password -}}
  {{- $pgPassword = .Values.postgresql.auth.password -}}
{{- else if and $existingSecret (index $existingSecret.data "postgresql-password") -}}
  {{- $pgPassword = index $existingSecret.data "postgresql-password" | b64dec -}}
{{- else -}}
  {{- $pgPassword = randAlphaNum 32 -}}
{{- end -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    app.kubernetes.io/name: pinchy
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  gateway-token: {{ $gatewayToken | quote }}
  better-auth-secret: {{ $betterAuthSecret | quote }}
  encryption-key: {{ $encryptionKey | quote }}
  {{- if not .Values.postgresql.auth.existingSecret }}
  postgresql-password: {{ $pgPassword | quote }}
  {{- end }}
