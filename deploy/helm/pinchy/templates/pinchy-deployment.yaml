{{- $secretName := include "pinchy.secretName" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-pinchy
  labels:
    app.kubernetes.io/name: pinchy
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.pinchy.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: pinchy
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pinchy
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-db
          image: {{ .Values.pinchy.image.repository }}:{{ .Values.pinchy.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.pinchy.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              echo "Waiting for PostgreSQL..."
              until node -e "
                const net = require('net');
                const s = net.connect({{ .Values.postgresql.port }}, '{{ include "pinchy.pgHost" . }}');
                s.on('connect', () => { s.destroy(); process.exit(0); });
                s.on('error', () => process.exit(1));
              "; do
                sleep 2
              done
              echo "PostgreSQL is ready."
      containers:
        - name: pinchy
          image: {{ .Values.pinchy.image.repository }}:{{ .Values.pinchy.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.pinchy.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 7777
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "7777"
            - name: OPENCLAW_BACKEND
              value: api
            - name: OPENCLAW_WS_URL
              value: ws://{{ .Release.Name }}-openclaw:{{ .Values.openclaw.service.port }}
            - name: GATEWAY_TOKEN_PATH
              value: /secrets/gateway-token
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: better-auth-secret
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: encryption-key
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pinchy.pgSecretName" . }}
                  key: {{ include "pinchy.pgSecretKey" . }}
            - name: DATABASE_URL
              value: postgresql://{{ .Values.postgresql.auth.username }}:$(DB_PASSWORD)@{{ include "pinchy.pgHost" . }}:{{ .Values.postgresql.port }}/{{ .Values.postgresql.name }}?sslmode={{ .Values.postgresql.sslmode }}
          volumeMounts:
            - name: secrets
              mountPath: /secrets
              readOnly: true
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.pinchy.resources | nindent 12 }}
      volumes:
        - name: secrets
          secret:
            secretName: {{ $secretName }}
            items:
              - key: gateway-token
                path: gateway-token
